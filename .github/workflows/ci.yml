name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_call:
    secrets:
      QLTY_COVERAGE_TOKEN:
        required: false

permissions: {}

jobs:
  ci:
    uses: PruvoNet/oss-workflows/.github/workflows/ci-node.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
    with:
      package-manager: yarn
      node-versions: '["20.x", "22.x", "24.x"]'
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      build-command: yarn build
      test-command: yarn test
      coverage-command: yarn cover
      qlty: true
    secrets:
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}

  zizmor:
    uses: PruvoNet/oss-workflows/.github/workflows/zizmor.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      contents: read
