version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release: a hijacked action version is usually caught and pulled by then.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
