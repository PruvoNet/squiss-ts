name: Publish

# The npm trusted publisher names this file (publish.yml), so keep its name.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Run tests before publish
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}

  publish:
    needs: [ test ]
    uses: PruvoNet/oss-workflows/.github/workflows/publish-npm.yml@638c70a621e280086c02bc7dcf4ccca4580d9041 # v1
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
    with:
      package-manager: yarn
      build-command: yarn build
