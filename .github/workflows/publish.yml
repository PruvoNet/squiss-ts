name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions: {}

env:
  # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
  NODE_VERSION: 24.x
  REGISTRY: https://registry.npmjs.org/

jobs:
  test:
    name: Run tests before publish
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}

  publish_version:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ test ]
    # A pre-release must never become the stable `latest` version on npm.
    if: github.event_name != 'release' || !github.event.release.prerelease
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY }}
          # No cache in the job that publishes: a poisoned cache entry would ship in the package.
          package-manager-cache: false

      - name: Install dependencies and build
        run: |
          yarn install --frozen-lockfile
          yarn build

      # npm never lets a published version be reused, so a tag/manifest mismatch must fail before publishing.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish
        run: |
          npm publish
